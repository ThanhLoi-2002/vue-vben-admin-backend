spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vben
    username: root
    password: "1"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jwt:
    signerKey: mysecretkeymysecretkeymysecretkeymysecretkey
    valid-duration: 2000 # millisecond 86400000
    refreshable-duration: 10000 # millisecond 604800000

  minio:
    endpoint: http://localhost:9000
    access-key: root
    secret-key: 123456789
    bucket: vben

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: OFF # Thêm dòng này để ẩn report auto-config
  pattern:
    #    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36}.%M(%line) : %msg%n"
    #    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36}.%M(%line) : %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} : %msg%n"